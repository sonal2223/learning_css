<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_transform_uppercase{
            text-transform: uppercase;
        }
        .t_transform_lowercase{
            text-transform: lowercase;
        }
        .capitalize{
            text-transform: capitalize;
        }
        .t_d_overline{
            text-decoration: overline;
        }
        .t_d_underline{
            text-decoration: underline;
        }
        .t_d_lineThrough{
            text-decoration: line-through;
        }
        .t_dec_lineThrough_underline_overline{
            text-decoration: line-through underline overline; 

            
        }
        .t_shadow{
            color: darkmagenta;
            font-size: 50px;
            text-shadow: 2px 7px 4px grey;
        }
.t_shadow1{
    color: crimson;
    font-size: 50px;
    text-shadow: 5px 4px 2px grey;
}
    </style>
</head>
<body>
    <h1><strong>Text Transform</strong></h1>
    <h2 class="t_transform_uppercase"> Welcome To My World</h2>
    <h2 class="t_transform_lowercase">Welcome to my hp World</h2>
    <h2 class="capitalize">Welcome to my Linux world</h2>
    <hr>
    <h1><strong>Text Decoration</strong></h1>
    <h1 class="t_d_overline">Welcome to My home </h1>
    <h1 class="t_d_underline">Welcome to My home </h1>
    <h1 class="t_d_lineThrough">Welcome to My home </h1>
<h1 class="t_dec_lineThrough_underline_overline">Welcome to My home </h1>
<hr>
<h1>Text Shadow</h1>
<h1 class="t_shadow">Sonal</h1>
<h1 class="t_shadow1">Welcome to our Class</h1>

</body>
</html>
